<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ICUE Parcel + Datum Logo</title>
  <desc id="desc">A cadastral parcel symbol with a central survey datum, paired with the ICUE wordmark and institute name.</desc>

  <g id="symbol" transform="translate(42,60)">
    <!-- parcel blocks -->
    <rect x="0"   y="0"   width="104" height="104" rx="2" fill="#0B1D34"/>
    <rect x="116" y="0"   width="104" height="104" rx="2" fill="#0B1D34"/>
    <rect x="0"   y="116" width="104" height="104" rx="2" fill="#0B1D34"/>
    <rect x="116" y="116" width="104" height="104" rx="2" fill="#2E6FAE"/>

    <!-- central datum reserve -->
    <rect x="82" y="82" width="56" height="56" rx="2" fill="#FFFFFF"/>

    <!-- datum / target -->
    <circle cx="110" cy="110" r="19" fill="none" stroke="#0B1D34" stroke-width="4"/>
    <circle cx="110" cy="110" r="4.5" fill="#2E6FAE"/>
    <path d="M110 84V136 M84 110H136" fill="none" stroke="#0B1D34" stroke-width="4" stroke-linecap="square"/>
  </g>

  <g id="wordmark" transform="translate(320,82)">
    <text x="0" y="82"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="108" letter-spacing="12" fill="#0B1D34">ICUE</text>

    <line x1="3" y1="112" x2="494" y2="112" stroke="#2E6FAE" stroke-width="4"/>

    <text x="0" y="158"
      font-family="Arial, Helvetica, sans-serif"
      font-size="27" font-weight="600" letter-spacing="3.2" fill="#0B1D34">
      INSTITUTE OF CONSTRUCTION
    </text>
    <text x="0" y="198"
      font-family="Arial, Helvetica, sans-serif"
      font-size="27" font-weight="600" letter-spacing="3.2" fill="#0B1D34">
      &amp; URBAN ECONOMICS
    </text>

    <text x="0" y="250"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18" letter-spacing="4" fill="#6B7280">
      MEASURE · ANALYSE · ADVISE · ADVANCE
    </text>
  </g>
</svg>