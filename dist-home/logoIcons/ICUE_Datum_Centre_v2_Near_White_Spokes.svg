<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">ICUE Datum Centre</title>
  <desc id="desc">Eight spoke geometry with four navy orthogonal bars and four teal diagonal bars around a circular survey datum.</desc>
  <g transform="translate(500 500)">
    <!-- Orthogonal navy spokes -->
    <rect x="-42" y="-330" width="84" height="250" rx="4" fill="#F4F7F8"/>
    <rect x="-42" y="80" width="84" height="250" rx="4" fill="#F4F7F8"/>
    <rect x="80" y="-42" width="250" height="84" rx="4" fill="#F4F7F8"/>
    <rect x="-330" y="-42" width="250" height="84" rx="4" fill="#F4F7F8"/>

    <!-- Diagonal teal spokes -->
    <g transform="rotate(45)">
      <rect x="-36" y="-315" width="72" height="235" rx="4" fill="#2FAE9B"/>
      <rect x="-36" y="80" width="72" height="235" rx="4" fill="#2FAE9B"/>
    </g>
    <g transform="rotate(-45)">
      <rect x="-36" y="-315" width="72" height="235" rx="4" fill="#2FAE9B"/>
      <rect x="-36" y="80" width="72" height="235" rx="4" fill="#2FAE9B"/>
    </g>

    <!-- Datum centre -->
    <circle r="104" fill="#FFFFFF"/>
    <circle r="72" fill="#FFFFFF" stroke="#2E6FAE" stroke-width="20"/>
    <circle r="30" fill="#FFFFFF" stroke="#2E6FAE" stroke-width="10"/>
  </g>
</svg>