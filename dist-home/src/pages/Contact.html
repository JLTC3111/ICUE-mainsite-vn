<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <meta name="twitter:title" content="iCUE Vietnam | Viện Nghiên Cứu Kinh Tế Xây Dựng Đô Thị" />
    <meta name="twitter:description" content="Website chính thức của ICUE Vietnam, Viện Nghiên Cứu Kinh Tế Xây Dựng Đô Thị, Trung Tâm Sáng Tạo, Đổi Mới. Khám phá các dự án, hoạt động cộng đồng, tin tức và thông tin liên hệ." />
    <meta name="description" content="Website chính thức của ICUE Vietnam, Viện Nghiên Cứu Kinh Tế Xây Dựng Đô Thị, Trung Tâm Sáng Tạo, Đổi Mới. Khám phá các dự án, hoạt động cộng đồng, tin tức và thông tin liên hệ." />
    <link rel="stylesheet" href="styles.css">
</head>
<body class="contact-page">
  <div class="contact-container">
    <h1>Nhắn Tin</h1>

    <form name="contact" method="POST" data-netlify="true" id="contactForm">
      <input type="hidden" name="form-name" value="contact">

      <div class="form-group">
        <label for="name">Tên</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="message">Nội Dung</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit" class="submit-button">Gửi Thông Tin</button>
    </form>

    <!-- Thank You Message -->
    <div id="thankYouMessage" style="display: none; margin-top: 20px; color: green; font-weight: bold;">
      🎉 Cám Ơn Bạn! Tin Nhắn Đã Được Gửi!
    </div>
    
    <div class="contact-info">
      <h2></h2>
      <p><strong>Email:</strong><a href="mailto:info@icue.vn" aria-label="Send email to info@icue.vn">info@icue.vn</a></p>
      <p><strong>Điện Thoại:</strong> +84 (24) 3772 8485</p>
      <p><strong>Văn Phòng:</strong> Số 20, Ngõ 114, Hoàng Ngân, Trung Hoà, Cầu Giấy, HN</p>
    </div>
  </div>

</body>
</html>
