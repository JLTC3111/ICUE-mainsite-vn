          <section>
            <h2>Áo ấm cho con đến trường</h2>
            <p>2024-01-15 — Trường Mầm non thôn Thượng Sơn, thị trấn Tam Sơn, huyện Quản Bạ, tỉnh Hà Giang</p>
            <p>Ngày 15 tháng 1 năm 2024, đoàn Viện Nghiên cứu Kinh tế Xây dựng và Đô thị đến Trường Mầm non thôn Thượng Sơn, thị trấn Tam Sơn, huyện Quản Bạ, tỉnh Hà Giang.</p>
            <p>Mỗi em nhỏ nhận một phần quà và một chiếc áo khoác mới đủ ấm cho mùa đông vùng cao. Nhà trường được trao thêm dầu ăn, mì gói, cùng một tivi LG 43 inch và loa thanh phục vụ việc dạy và học.</p>
            <ul>
              <li>Đại diện Viện phát biểu khai mạc, phía sau là những phần quà đã xếp sẵn trên bàn.</li>
              <li>Các em nhỏ cùng thầy cô và đoàn công tác trước phông chương trình.</li>
              <li>Phông chương trình ghi rõ địa điểm và ngày tổ chức: 15.01.2024.</li>
              <li>Các em vây quanh bàn của đoàn công tác; dầu ăn xếp thành hàng phía bên trái.</li>
              <li>Bàn giao tivi LG 43 inch và loa thanh cho nhà trường.</li>
              <li>Các em trong lớp học, mặc những chiếc áo khoác mới vừa được trao.</li>
            </ul>
          </section>
          <section>
            <h2>Hỗ trợ bà con huyện Bảo Yên khắc phục bão lũ Yagi</h2>
            <p>Nhà Văn hóa Bản Chom, xã Yên Sơn, huyện Bảo Yên, tỉnh Lào Cai</p>
            <p>Sau bão Yagi, đoàn Viện Nghiên cứu Kinh tế Xây dựng và Đô thị lên đường từ Hà Nội trong đêm, mang theo gạo và nhu yếu phẩm cho bà con huyện Bảo Yên, tỉnh Lào Cai.</p>
            <p>Điểm phát đặt tại Nhà Văn hóa Bản Chom, xã Yên Sơn. Chương trình được thực hiện cùng Ủy ban nhân dân huyện Bảo Yên và các đơn vị đồng hành.</p>
            <ul>
              <li>Đoàn công tác trước giờ xuất phát từ Hà Nội, băng rôn cứu trợ treo trước đầu xe.</li>
              <li>Đại diện Viện trò chuyện cùng người dân dưới băng rôn chương trình.</li>
              <li>Gạo và các suất quà xếp sẵn trước Nhà Văn hóa Bản Chom, bà con xếp hàng nhận.</li>
              <li>Trao từng suất quà; trên túi ghi rõ chương trình hỗ trợ huyện Bảo Yên – Lào Cai.</li>
              <li>Đoàn công tác và bà con sau khi phát xong.</li>
            </ul>
          </section>
