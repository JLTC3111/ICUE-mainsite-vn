[build]
  command = "npm run build"
  publish = "dist-home"

# Newsroom requires Supabase credentials at build time (Site settings → Environment):
#   VITE_SUPABASE_URL  or  SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY  or  SUPABASE_ANON_KEY
#
# Article translations are authored by editors in the newsroom and read straight
# from Supabase (public.article_translations) — no translation API, no key.
#
# gemini-article (AI Assist at /newsroom/assist) needs:
#   GEMINI_API_KEY               — required (scope: Functions)
#   GEMINI_MODEL                 — optional (default: gemini-3.5-flash-lite)
#
# flux-image (Generate Image via Workers AI FLUX) needs:
#   CLOUDFLARE_ACCOUNT_ID        — required (scope: Functions)
#   CLOUDFLARE_API_TOKEN         — required (Workers AI permission)
#   CLOUDFLARE_FLUX_MODEL        — optional (default: @cf/black-forest-labs/flux-1-schnell)
#
# Server credentials are read only from the Functions runtime environment. Do
# not expose them to Builds unless another build step explicitly requires them.

[functions]
  directory = "netlify/functions"
  # gemini-article / flux-image dynamically import source outside the functions
  # directory. Keep those modules and their local dependencies in the deployed
  # bundle; otherwise zip-it-and-ship-it can omit them even though the function
  # source exists in the repository.
  #
  # news-app/package.json (with "type": "module") must ALSO be included:
  # news-app/src/lib/**.js is ESM, and Node determines that by walking up
  # from the imported file to the nearest package.json. Without this file
  # present in the deployed bundle, Node finds no package.json above
  # news-app/src/lib and falls back to CommonJS, so the dynamic import throws
  # "Cannot use import statement outside a module" at runtime in production
  # even though the function deploys successfully and the file is present.
  included_files = [
    "newsroom/supabase-config.json",
    "news-app/public/supabase-config.json",
    "news-app/package.json",
    "news-app/src/lib/**",
    "shared/text/**"
  ]
