[build]
  command = "npm run build"
  publish = "."

# Newsroom requires Supabase credentials at build time (Site settings → Environment):
#   VITE_SUPABASE_URL  or  SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY  or  SUPABASE_ANON_KEY
#
# translate-article function needs these Netlify env vars:
#   GOOGLE_TRANSLATE_API_KEY     — required (scope: Builds + Functions)
#   SUPABASE_SERVICE_ROLE_KEY    — recommended for translation cache
#
# Keys are baked into the function bundle at build time (private-env.cjs) and
# also read at runtime. Enable BOTH Builds and Functions scopes in Netlify UI.

[functions]
  directory = "netlify/functions"
  included_files = ["newsroom/supabase-config.json", "news-app/public/supabase-config.json"]
