[build]
  command = "npm run build"
  publish = "."

# Newsroom requires Supabase credentials at build time (Site settings → Environment):
#   VITE_SUPABASE_URL  or  SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY  or  SUPABASE_ANON_KEY
#
# translate-article function needs these Netlify env vars:
#   GOOGLE_TRANSLATE_API_KEY     — required (scope: Builds + Functions)
#   SUPABASE_SERVICE_ROLE_KEY    — required to persist article/comment/text translation cache
#                                 (without it, every language switch re-runs Google Translate)
#
# gemini-article (AI Assist at /newsroom/assist) needs:
#   GEMINI_API_KEY               — required (scope: Builds + Functions)
#   GEMINI_MODEL                 — optional (default: gemini-3.5-flash-lite)
#
# flux-image (Generate Image via Workers AI FLUX) needs:
#   CLOUDFLARE_ACCOUNT_ID        — required (scope: Builds + Functions)
#   CLOUDFLARE_API_TOKEN         — required (Workers AI permission)
#   CLOUDFLARE_FLUX_MODEL        — optional (default: @cf/black-forest-labs/flux-1-schnell)
#
# Keys are baked into the function bundle at build time (private-env.cjs) and
# also read at runtime. Enable BOTH Builds and Functions scopes in Netlify UI.

[functions]
  directory = "netlify/functions"
  included_files = ["newsroom/supabase-config.json", "news-app/public/supabase-config.json"]
