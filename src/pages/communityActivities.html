<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Cộng Đồng ICUE</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="/public/logoIcons/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .community-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 60px 20px 40px;
            margin-top: 7.5%;
        }

        .community-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 300;
            text-align: center;
            margin-bottom: 3rem;
            letter-spacing: -0.02em;
            background: linear-gradient(45deg, #ffffff, #c8ff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            z-index: 10;
            position: relative;
        }

        .community-subtitle {
            font-size: clamp(1rem, 3vw, 1.4rem);
            text-align: center;
            margin-bottom: 1rem;
            opacity: 0.9;
            max-width: 800px;
            z-index: 10;
            position: relative;
        }

        .community-subtitle a {
            color: #c8ff00;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .community-subtitle a:hover {
            text-decoration: underline;
            color: #ffffff;
        }

        .community-description {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            text-align: center;
            margin-bottom: 4rem;
            opacity: 0.8;
            max-width: 600px;
            z-index: 10;
            position: relative;
        }

        .community-gallery {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .photo-collage {
            position: relative;
            width: 100%;
            height: 70vh;
            min-height: 500px;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            transform: rotateX(5deg) rotateY(-2deg);
            transition: transform 0.6s ease;
        }

        .photo-collage:hover {
            transform: rotateX(0deg) rotateY(0deg) scale(1.02);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 100%;
            height: 100%;
            gap: 2px;
        }

        .photo-item {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s ease;
            cursor: pointer;
            opacity: 0.8;
        }

        .photo-item:hover {
            transform: scale(1.05);
            opacity: 1;
            z-index: 5;
            box-shadow: 0 10px 30px rgba(200, 255, 0, 0.3);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.4s ease;
        }

        .photo-item:hover img {
            transform: scale(1.1);
        }

        /* Specific grid placements for variety */
        .photo-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
        .photo-item:nth-child(2) { grid-column: span 1; grid-row: span 1; }
        .photo-item:nth-child(3) { grid-column: span 1; grid-row: span 1; }
        .photo-item:nth-child(4) { grid-column: span 2; grid-row: span 1; }
        .photo-item:nth-child(5) { grid-column: span 1; grid-row: span 2; }
        .photo-item:nth-child(6) { grid-column: span 1; grid-row: span 1; }
        .photo-item:nth-child(7) { grid-column: span 2; grid-row: span 1; }
        .photo-item:nth-child(8) { grid-column: span 1; grid-row: span 1; }
        .photo-item:nth-child(9) { grid-column: span 1; grid-row: span 1; }
        .photo-item:nth-child(10) { grid-column: span 3; grid-row: span 2; }
        .photo-item:nth-child(11) { grid-column: span 1; grid-row: span 1; }
        .photo-item:nth-child(12) { grid-column: span 2; grid-row: span 1; }

        .community-actions {
            margin-top: 4rem;
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            z-index: 10;
            position: relative;
        }

        .community-btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .community-btn.primary {
            background: linear-gradient(45deg, #c8ff00, #a0d000);
            color: #000;
        }

        .community-btn.secondary {
            background: transparent;
            color: #ffffff;
            border: 2px solid #c8ff00;
        }

        .community-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(200, 255, 0, 0.3);
        }

        .community-btn.primary:hover {
            background: linear-gradient(45deg, #ffffff, #c8ff00);
        }

        .community-btn.secondary:hover {
            background: #c8ff00;
            color: #000;
        }

        .photo-credit {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
            z-index: 10;
        }

        .photo-credit a {
            color: #c8ff00;
            text-decoration: none;
        }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #c8ff00;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        .floating-dot:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .floating-dot:nth-child(2) { top: 60%; left: 85%; animation-delay: 2s; }
        .floating-dot:nth-child(3) { top: 80%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .community-hero {
                padding: 40px 15px 30px;
                margin-top: 15%;
            }

            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(6, 1fr);
                gap: 1px;
            }

            .photo-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
            .photo-item:nth-child(2) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(3) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(4) { grid-column: span 2; grid-row: span 1; }
            .photo-item:nth-child(5) { grid-column: span 1; grid-row: span 2; }
            .photo-item:nth-child(6) { grid-column: span 2; grid-row: span 1; }
            .photo-item:nth-child(7) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(8) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(9) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(10) { grid-column: span 3; grid-row: span 2; }
            .photo-item:nth-child(11) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(12) { grid-column: span 2; grid-row: span 1; }

            .photo-collage {
                height: 60vh;
                min-height: 400px;
                transform: none;
            }

            .photo-collage:hover {
                transform: scale(1.01);
            }

            .community-actions {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                margin-top: 3rem;
            }

            .community-btn {
                padding: 0.8rem 2rem;
                font-size: 1rem;
                width: 280px;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(8, 1fr);
            }

            .photo-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
            .photo-item:nth-child(2) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(3) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(4) { grid-column: span 2; grid-row: span 1; }
            .photo-item:nth-child(5) { grid-column: span 1; grid-row: span 2; }
            .photo-item:nth-child(6) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(7) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(8) { grid-column: span 2; grid-row: span 1; }
            .photo-item:nth-child(9) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(10) { grid-column: span 1; grid-row: span 1; }
            .photo-item:nth-child(11) { grid-column: span 2; grid-row: span 2; }
            .photo-item:nth-child(12) { grid-column: span 2; grid-row: span 1; }
        }
    </style>
</head>

        </div>
    </main>
</body>
</html>
