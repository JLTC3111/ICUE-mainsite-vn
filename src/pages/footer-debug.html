<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Debug Test</title>
</head>
<body data-footer="true" class="with-footer">
    <div style="padding: 40px; background: white; margin-bottom: 40px;">
        <h1>Footer Debug Test</h1>
        <p>Check the console for debug messages.</p>
        <button onclick="manualTest()">Manual Footer Test</button>
    </div>

    <script src="../main.js"></script>
    <script>
        function manualTest() {
            console.log('=== MANUAL FOOTER TEST ===');
            if (window.ICUEFooter) {
                console.log('ICUEFooter available, calling inject...');
                window.ICUEFooter.inject();
            } else {
                console.log('ICUEFooter not available');
            }
        }
        
        // Check if injectFooterPages exists
        console.log('injectFooterPages function exists:', typeof injectFooterPages);
        console.log('injectFooter function exists:', typeof injectFooter);
    </script>
</body>
</html>
