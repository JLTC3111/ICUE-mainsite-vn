        <main>
          <p>ICUE VIETNAM</p>
          <h1>Câu hỏi thường gặp</h1>
          <section>
            <h2>Dịch Vụ</h2>
            <h3>Bạn cung cấp những loại dịch vụ tư vấn nào?</h3>
            <p>Chúng tôi cung cấp tư vấn về lập kế hoạch, thiết kế, quản lý dự án, giám sát và hỗ trợ thủ tục pháp lý.</p>
            <h3>Bạn có nhận các dự án nhà ở nhỏ không?</h3>
            <p>Có, chúng tôi xử lý từ nhà ở dân dụng đến các công trình thương mại và công nghiệp.</p>
          </section>
          <section>
            <h2>Quy Trình Làm Việc</h2>
            <h3>Quy trình hợp tác như thế nào?</h3>
            <p>Quy trình gồm: tư vấn ban đầu → khảo sát hiện trường → thiết kế sơ bộ → hoàn thiện bản vẽ → hỗ trợ thi công.</p>
            <h3>Tôi có thể chỉnh sửa thiết kế trong quá trình thực hiện không?</h3>
            <p>Có, khách hàng có quyền yêu cầu chỉnh sửa ở các giai đoạn khác nhau trước khi hoàn tất bản vẽ.</p>
          </section>
          <section>
            <h2>Chi Phí &amp; Thanh Toán</h2>
            <h3>Phí dịch vụ được tính như thế nào?</h3>
            <p>Phí có thể tính theo gói, theo % tổng vốn đầu tư hoặc theo giờ tùy loại dự án.</p>
            <h3>Bạn có cho phép thanh toán theo đợt không?</h3>
            <p>Có, chúng tôi chấp nhận thanh toán linh hoạt theo từng giai đoạn dự án.</p>
          </section>
          <section>
            <h2>Pháp Lý &amp; Giấy Tờ</h2>
            <h3>Bạn có hỗ trợ xin giấy phép xây dựng không?</h3>
            <p>Có, chúng tôi hỗ trợ đầy đủ từ chuẩn bị hồ sơ đến nộp cho cơ quan chức năng.</p>
            <h3>Khách hàng cần cung cấp những giấy tờ gì?</h3>
            <p>Thường là: giấy chứng nhận quyền sử dụng đất, bản vẽ hiện trạng và các giấy tờ pháp lý liên quan.</p>
          </section>
          <section>
            <h2>Tiến Độ Dự Án</h2>
            <h3>Bao lâu để hoàn thành một dự án?</h3>
            <p>Tùy quy mô, thường 2-6 tháng cho thiết kế và 6-18 tháng cho thi công.</p>
            <h3>Nếu dự án bị chậm tiến độ thì sao?</h3>
            <p>Chúng tôi sẽ báo cáo ngay, đề xuất giải pháp và cam kết đuổi tiến độ khi có thể.</p>
          </section>
          <section>
            <h2>Công Nghệ &amp; Bền Vững</h2>
            <h3>Bạn có sử dụng công nghệ BIM không?</h3>
            <p>Có, chúng tôi sử dụng BIM và mô hình 3D để giúp khách hàng hình dung thiết kế rõ ràng.</p>
            <h3>Bạn có cung cấp các giải pháp thiết kế xanh không?</h3>
            <p>Có, chúng tôi ưu tiên vật liệu bền vững và giải pháp tiết kiệm năng lượng.</p>
          </section>
          <section>
            <h2>Khách Hàng &amp; Hỗ Trợ</h2>
            <h3>Khách hàng chính của bạn là ai?</h3>
            <p>Chúng tôi phục vụ cá nhân, doanh nghiệp và cơ quan nhà nước.</p>
            <h3>Bạn có hỗ trợ bảo trì sau khi bàn giao không?</h3>
            <p>Có, chúng tôi cung cấp dịch vụ hậu mãi và bảo trì theo yêu cầu.</p>
          </section>
          <section>
            <h2>Thắc Mắc Thường Gặp</h2>
            <h3>Tôi có thể xem các dự án trước đây của bạn không?</h3>
            <p>Có, vui lòng liên hệ để nhận danh mục và danh sách dự án của chúng tôi.</p>
            <h3>Cách nhanh nhất để liên hệ với bạn là gì?</h3>
            <p>Bạn có thể gọi trực tiếp hotline hoặc gửi email, chúng tôi sẽ phản hồi trong vòng 24 giờ.</p>
          </section>
