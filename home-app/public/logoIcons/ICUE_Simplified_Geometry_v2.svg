<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">ICUE Simplified Geometry</title>
  <desc id="desc">Eight spoke circular geometry with four navy orthogonal bars and four teal diagonal bars converging on a white center.</desc>
  <g transform="translate(500 500)">
    <!-- Orthogonal navy spokes -->
    <rect x="-42" y="-330" width="84" height="250" rx="4" fill="#0B1F3A"/>
    <rect x="-42" y="80" width="84" height="250" rx="4" fill="#0B1F3A"/>
    <rect x="80" y="-42" width="250" height="84" rx="4" fill="#0B1F3A"/>
    <rect x="-330" y="-42" width="250" height="84" rx="4" fill="#0B1F3A"/>

    <!-- Diagonal teal spokes -->
    <g transform="rotate(45)">
      <rect x="-36" y="-315" width="72" height="235" rx="4" fill="#2FAE9B"/>
      <rect x="-36" y="80" width="72" height="235" rx="4" fill="#6FC3B8"/>
    </g>
    <g transform="rotate(-45)">
      <rect x="-36" y="-315" width="72" height="235" rx="4" fill="#2FAE9B"/>
      <rect x="-36" y="80" width="72" height="235" rx="4" fill="#6FC3B8"/>
    </g>

    <!-- Central soft hub -->
    <circle r="78" fill="#FFFFFF"/>
    <circle r="44" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>