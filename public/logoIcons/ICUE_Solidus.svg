<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ICUE Solidus Logo</title>
  <desc id="desc">An analytical IC/UE wordmark using a blue solidus as a surveying and measurement device, with the institute name below.</desc>

  <g id="wordmark" transform="translate(70,72)">
    <text x="0" y="120"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="142" letter-spacing="5" fill="#0B1D34">IC</text>

    <!-- custom solidus -->
    <polygon points="258,7 283,7 235,132 210,132" fill="#2E6FAE"/>

    <text x="300" y="120"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="142" letter-spacing="5" fill="#0B1D34">UE</text>

    <line x1="2" y1="155" x2="676" y2="155" stroke="#2E6FAE" stroke-width="4"/>

    <text x="2" y="205"
      font-family="Arial, Helvetica, sans-serif"
      font-size="26" font-weight="600" letter-spacing="3.1" fill="#0B1D34">
      INSTITUTE OF CONSTRUCTION &amp; URBAN ECONOMICS
    </text>

    <text x="2" y="258"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18" letter-spacing="4" fill="#6B7280">
      MEASURE · ANALYSE · ADVISE · ADVANCE
    </text>
  </g>

  <!-- small standalone mark, useful for favicon/app icon -->
  <g id="standalone-mark" transform="translate(900,78)">
    <rect x="0" y="0" width="180" height="180" rx="28" fill="#0B1D34"/>
    <text x="25" y="112"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="70" letter-spacing="1" fill="#FFFFFF">IC</text>
    <polygon points="97,42 109,42 87,126 75,126" fill="#2E6FAE"/>
    <text x="111" y="112"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="70" letter-spacing="1" fill="#FFFFFF">UE</text>
  </g>
</svg>