    <!-- Paint the stored theme before first paint; otherwise a light-theme
         visitor gets one dark frame on every navigation. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('icue-ourwork-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
