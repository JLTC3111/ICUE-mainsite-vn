    <!--
      Netlify detects forms by parsing the HTML it deploys, and it never runs
      React — so the real form (rendered by ContactForm.jsx) is invisible to it.
      This copy is the declaration: same form name, same field names, hidden from
      readers. Keep the two in step; a field missing here is a field silently
      dropped from every submission. See src/lib/netlifyForm.js for the POST.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="topic" />
      <input type="text" name="name" />
      <input type="text" name="org" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="location" />
      <textarea name="message"></textarea>
      <input type="text" name="consent" />
      <input type="text" name="language" />
    </form>
